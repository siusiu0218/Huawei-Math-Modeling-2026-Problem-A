crosoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="520" y="1254.3">按Cache Makespan择优</tspan><tspan x="520" y="1285.1">平局保留基准方案</tspan></text><polyline points="715,1262 745,1262" fill="none" stroke="#B06B34" stroke-width="1.9"/><polygon points="745,1262 736,1258 736,1266 745,1262" fill="#B06B34"/><rect x="745" y="1231" width="380" height="62" fill="#FFFFFF" stroke="#B06B34" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#203146" text-anchor="middle"><tspan x="935" y="1254.6499999999999">同方案无L2／有L2配对评估</tspan><tspan x="935" y="1284.05">区分调度收益与Cache收益</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#596779" text-anchor="middle"><tspan x="600" y="1323.3">窗口法包含子图划分与核分配变化；比较基准与新方案时，保持图、核数和配置一致</tspan></text><polyline points="600,1340 600,1375" fill="none" stroke="#596779" stroke-width="1.9"/><polygon points="600,1375 604,1366 596,1366 600,1375" fill="#596779"/><rect x="50" y="1375" width="1100" height="213" fill="#F5F7F9" stroke="#B9C5D0" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="600" y="1411.1">统一验证与结果分析</tspan></text><rect x="75" y="1434" width="234" height="77" fill="#FFFFFF" stroke="#B9C5D0" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="192" y="1465.1499999999999">方案合法性</tspan><tspan x="192" y="1494.55">依赖顺序与容量约束</tspan></text><polyline points="309,1472 347,1472" fill="none" stroke="#596779" stroke-width="1.9"/><polygon points="347,1472 338,1468 338,1476 347,1472" fill="#596779"/><rect x="347" y="1434" width="234" height="77" fill="#FFFFFF" stroke="#B9C5D0" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#203146" text-anchor="middle"><tspan x=