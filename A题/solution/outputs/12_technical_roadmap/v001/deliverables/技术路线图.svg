<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660"><rect width="100%" height="100%" fill="white"/><text font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="600" y="68.1">NPU计算图划分与多核调度优化技术路线</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#596779" text-anchor="middle"><tspan x="600" y="106.35">面向三种存储场景的子图划分、核间分配与执行调度</tspan></text><rect x="50" y="132" width="530" height="85" fill="#F5F7F9" stroke="#B9C5D0" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="315" y="166.45000000000002">计算图输入</tspan><tspan x="315" y="198.65">算子依赖 · 计算周期 · 张量大小 · 存储位置</tspan></text><rect x="620" y="132" width="530" height="85" fill="#F5F7F9" stroke="#B9C5D0" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="885" y="166.45000000000002">硬件与场景约束</tspan><tspan x="885" y="198.65">核数 · L1/UB容量 · DDR带宽 · 同步开销</tspan></text><polyline points="315,217 315,240" fill="none" stroke="#596779" stroke-width="1.9"/><polygon points="315,240 319,231 311,231 315,240" fill="#596779"/><polyline points="885,217 885,240" fill="none" stroke="#596779" stroke-width="1.9"/><polygon points="885,240 889,231 881,231 885,240" fill="#596779"/><rect x="50" y="240" width="1100" height="94" fill="#263E55" stroke="none" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan x="165" y="290.75">共同决策模型</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan x="705" y="273.55">子图如何划分     算子分配到哪一核     各核按何顺序执行</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#E0EAF2" text-anchor="middle"><tspan x="705" y="308.5">目标：最小化总完成时间 Makespan    约束：依赖、容量与执行资源</tspan></text><polyline points="600,334 600,367" fill="none" stroke="#596779" stroke-width="1.9"/><polygon points="600,367 604,358 596,358 600,367" fill="#596779"/><rect x="50" y="367" width="1100" height="270" fill="#FFFFFF" stroke="#35648F" stroke-width="1.6"/><rect x="50" y="367" width="1100" height="49" fill="#EFF5FA" stroke="none" stroke-width="1.3"/><rect x="50" y="367" width="7" height="49" fill="#35648F" stroke="none" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="600" fill="#35648F" text-anchor="middle"><tspan x="106" y="399.4">01</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="600" fill="#35648F" text-anchor="start"><tspan x="147" y="400.1">问题一：子图边界经DDR搬运的调度优化</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#596779" text-anchor="start"><tspan x="75" y="444">场景A：子图作为任务执行，权衡并行计算收益与边界搬运开销</tspan></text><rect x="75" y="466" width="205" height="136" fill="#EFF5FA" stroke="#35648F" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="177.5" y="495.5">图结构分析</tspan><tspan x="177.5" y="526.3">拓扑依赖</tspan><tspan x="177.5" y="557.1">链与分支汇合</tspan><tspan x="177.5" y="587.9">独立连通分量</tspan></text><polyline points="280,534 297,534 297,495 315,495" fill="none" stroke="#35648F" stroke-width="1.8"/><polygon points="315,495 306,491 306,499 315,495" fill="#35648F"/><polyline points="297,534 297,573 315,573" fill="none" stroke="#35648F" stroke-width="1.8"/><polygon points="315,573 306,569 306,577 315,573" fill="#35648F"/><rect x="315" y="466" width="460" height="58" fill="#FFFFFF" stroke="#35648F" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#203146" text-anchor="middle"><tspan x="545" y="502.7">基准候选：拓扑分块与最早完成分核</tspan></text><rect x="315" y="544" width="460" height="58" fill="#FFFFFF" stroke="#35648F" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#203146" text-anchor="middle"><tspan x="545" y="580.7">结构候选：链收缩与闭合小区域合并</tspan></text><polyline points="775,495 800,495 800,573 775,573" fill="none" stroke="#35648F" stroke-width="1.8"/><polyline points="800,534 829,534" fill="none" stroke="#35648F" stroke-width="1.9"/><polygon points="829,534 820,530 820,538 829,534" fill="#35648F"/><rect x="829" y="466" width="296" height="136" fill="#EFF5FA" stroke="#35648F" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="977" y="509.85">场景A原始评估器</tspan><tspan x="977" y="542.0500000000001">比较两个候选Makespan</tspan><tspan x="977" y="574.25">保留耗时较小的方案</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#596779" text-anchor="middle"><tspan x="545" y="622.8">合并筛选兼顾搬运节约与并行性损失</tspan></text><polyline points="600,637 600,685" fill="none" stroke="#35648F" stroke-width="1.9"/><polygon points="600,685 604,676 596,676 600,685" fill="#35648F"/><rect x="615" y="645" width="428" height="30" fill="#FFFFFF" stroke="none" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#596779" text-anchor="start"><tspan x="620" y="666.65">复用图结构分析与候选生成方法</tspan></text><rect x="50" y="685" width="1100" height="283" fill="#FFFFFF" stroke="#287B74" stroke-width="1.6"/><rect x="50" y="685" width="1100" height="49" fill="#EEF7F4" stroke="none" stroke-width="1.3"/><rect x="50" y="685" width="7" height="49" fill="#287B74" stroke="none" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="600" fill="#287B74" text-anchor="middle"><tspan x="106" y="717.4">02</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="600" fill="#287B74" text-anchor="start"><tspan x="147" y="718.1">问题二：同核数据驻留下的分核与调度优化</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#596779" text-anchor="start"><tspan x="75" y="762">场景B：同核数据可驻留L1/UB，跨核传输需要搬运与同步</tspan></text><rect x="75" y="785" width="205" height="145" fill="#EEF7F4" stroke="#287B74" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="177.5" y="817.25">活跃核预算</tspan><tspan x="177.5" y="849.45">k = 1, …, N</tspan><tspan x="177.5" y="881.65">逐一生成候选</tspan><tspan x="177.5" y="913.85">保留单核方案</tspan></text><polyline points="280,857 297,857 297,814 315,814" fill="none" stroke="#287B74" stroke-width="1.8"/><polygon points="315,814 306,810 306,818 315,814" fill="#287B74"/><polyline points="297,857 297,897 315,897" fill="none" stroke="#287B74" stroke-width="1.8"/><polygon points="315,897 306,893 306,901 315,897" fill="#287B74"/><rect x="315" y="785" width="460" height="59" fill="#FFFFFF" stroke="#287B74" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#203146" text-anchor="middle"><tspan x="545" y="822.2">候选一：独立连通分量成对交错执行</tspan></text><rect x="315" y="865" width="460" height="65" fill="#FFFFFF" stroke="#287B74" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#203146" text-anchor="middle"><tspan x="545" y="890.5">候选二：区域／交错／大分量拆分</tspan><tspan x="545" y="918.5">通过核内调度与搬运代理代价筛选</tspan></text><polyline points="775,814 800,814 800,897 775,897" fill="none" stroke="#287B74" stroke-width="1.8"/><polyline points="800,857 829,857" fill="none" stroke="#287B74" stroke-width="1.9"/><polygon points="829,857 820,853 820,861 829,857" fill="#287B74"/><rect x="829" y="785" width="296" height="145" fill="#EEF7F4" stroke="#287B74" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="977" y="833.3499999999999">补齐为目标N核方案</tspan><tspan x="977" y="865.55">场景B原始评估器</tspan><tspan x="977" y="897.7499999999999">跨核预算与候选择优</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#596779" text-anchor="middle"><tspan x="695" y="953.3">最终选择依据为实际N核Makespan，代理代价仅用于候选内部筛选</tspan></text><polyline points="977,968 977,1020" fill="none" stroke="#287B74" stroke-width="1.9"/><polygon points="977,1020 981,1011 973,1011 977,1020" fill="#287B74"/><rect x="542" y="979" width="410" height="29" fill="#FFFFFF" stroke="none" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#596779" text-anchor="end"><tspan x="952" y="1000.15">第二问入选方案作为第三问基准</tspan></text><rect x="50" y="1020" width="1100" height="320" fill="#FFFFFF" stroke="#B06B34" stroke-width="1.6"/><rect x="50" y="1020" width="1100" height="49" fill="#FCF4EA" stroke="none" stroke-width="1.3"/><rect x="50" y="1020" width="7" height="49" fill="#B06B34" stroke="none" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="600" fill="#B06B34" text-anchor="middle"><tspan x="106" y="1052.4">03</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="600" fill="#B06B34" text-anchor="start"><tspan x="147" y="1053.1">问题三：共享L2 Cache场景下的候选调度优化</tspan></text><text font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#596779" text-anchor="start"><tspan x="75" y="1097">场景B + 共享L2：以原始FIFO Cache评估器计算耗时，保留基准候选</tspan></text><rect x="75" y="1120" width="235" height="91" fill="#FCF4EA" stroke="#B06B34" stroke-width="1.3"/><text font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#203146" text-anchor="middle"><tspan x="192.5" y="1157.8">按拓扑深度分窗口</tspan><tspan x="192.5" y="1188.6">w = 4 / 10 / 16</tspan></text><polyline 